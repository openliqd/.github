<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">OpenLiqd — Be the market.</title>
  <desc id="description">OpenLiqd's bell-and-bars mark on a midnight blue background. Wallet-based liquidity. Onchain execution.</desc>
  <defs>
    <radialGradient id="glow" cx="80%" cy="48%" r="65%">
      <stop offset="0" stop-color="#113a50"/>
      <stop offset="1" stop-color="#060a10"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a9cde2"/>
      <stop offset="1" stop-color="#7debd3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="480" rx="24" fill="#060a10"/>
  <rect width="1280" height="480" rx="24" fill="url(#glow)"/>
  <g fill="none" stroke="#8fd3f0" stroke-opacity=".1">
